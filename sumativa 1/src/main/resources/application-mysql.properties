spring.application.name=backendpetsalud

# Configuracion para despliegue con base de datos MySQL (activar con --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=petsalud_user
spring.datasource.password=petsalud_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion JWT
jwt.secret=PetSaludSeguridad2024ClaveSuperSecretaConMasDe256BitsParaAlgoritmoHS256DuocUC
jwt.expiration=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
