spring.application.name=backendpetsalud

# Base de datos H2 en memoria (Por defecto para desarrollo y ejecucion inmediata de pruebas sin dependencias externas)
spring.datasource.url=jdbc:h2:mem:petsalud_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web H2 para inspeccion rapida de tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuracion JWT (Clave secreta segura >= 256 bits para HMAC-SHA256 y expiracion en 24h = 86400000 ms)
jwt.secret=PetSaludSeguridad2024ClaveSuperSecretaConMasDe256BitsParaAlgoritmoHS256DuocUC
jwt.expiration=86400000

# Configuracion de Documentacion OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
